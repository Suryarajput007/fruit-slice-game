<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fruit Slice</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap">
<style>
:root{box-sizing:border-box;--bg1:#1b1033;--bg2:#0e2d3f;--ink:#fff7e6;--gold:#ffd23f;--pink:#ff5d8f;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg1);color:var(--ink);font-family:"Lilita One","Trebuchet MS",system-ui,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;background:radial-gradient(ellipse at 50% 110%,#2f2a66 0,var(--bg1) 45%,var(--bg2) 100%)}
#hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 0;pointer-events:none}
#score{font-size:clamp(40px,8vw,72px);line-height:1;color:var(--gold);text-shadow:0 3px 0 #0006}
#best{font-size:16px;opacity:.7;margin-top:4px}
#right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#lives{font-size:clamp(26px,5vw,38px);letter-spacing:4px}
#mute{pointer-events:auto;background:#ffffff1a;border:0;color:var(--ink);border-radius:999px;font:inherit;font-size:15px;padding:6px 14px;cursor:pointer}
#mute:focus-visible,#play:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;background:#0e0820b8;padding:24px}
#ov{overflow-y:auto}
#ov.hide{display:none}
#lbw{width:min(360px,100%);background:#ffffff14;border-radius:16px;padding:12px 16px}
#lbw h2{margin:0 0 6px;font-size:22px;font-weight:400;color:var(--gold)}
#lb{list-style:none;margin:0;padding:0;font-size:18px;text-align:left}
#lb li{display:flex;gap:10px;padding:4px 6px;border-radius:8px}
#lb li.me{background:#ffd23f33}
#lb .rk{width:1.6em;opacity:.7}#lb .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#lb .sc{color:var(--gold)}
#lbn{margin:6px 0 0;font-size:14px;opacity:.75}
h1{margin:0;font-size:clamp(48px,11vw,110px);line-height:.95;font-weight:400;color:var(--gold);transform:rotate(-3deg);text-shadow:0 5px 0 var(--pink)}
#msg{font-size:clamp(18px,3.4vw,24px);max-width:30ch;line-height:1.35;margin:0}
#play{font:inherit;font-size:28px;background:var(--pink);color:#fff;border:0;border-radius:18px;padding:12px 42px;cursor:pointer;box-shadow:0 6px 0 #a3305a}
#play:active{transform:translateY(4px);box-shadow:0 2px 0 #a3305a}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div><div id="score">0</div><div id="best">Best 0</div></div>
  <div id="right"><div id="lives" aria-label="Lives"></div><button id="mute" aria-pressed="false">Sound on</button></div>
</div>
<div id="ov">
  <h1 id="title">Fruit Slice</h1>
  <p id="msg">Swipe your finger or glide your trackpad across fruit to slice it. Avoid the bombs. Don't let 3 fruits fall.</p>
  <button id="play">Play</button>
  <div id="lbw"><h2>Leaderboard</h2><ol id="lb"></ol><p id="lbn">Loading scores…</p></div>
</div>
<script>
(function(){
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();

const TYPES=[
 {e:'🍉',flesh:'#ff3f55',juice:'#ff4d5e',k:1.15},
 {e:'🍊',flesh:'#ffb02e',juice:'#ffa021',k:1},
 {e:'🍎',flesh:'#fff3d1',juice:'#ffe9b8',k:1},
 {e:'🍋',flesh:'#fff27a',juice:'#fff27a',k:1},
 {e:'🍓',flesh:'#ff5b6e',juice:'#ff3355',k:.95},
 {e:'🍍',flesh:'#ffe14a',juice:'#ffe14a',k:1.1},
 {e:'🥝',flesh:'#9ed03c',juice:'#8fc22e',k:.95},
 {e:'🍑',flesh:'#ffb36b',juice:'#ff9c55',k:1}
];
const EMOJI='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
let best=0;try{best=+localStorage.getItem('fruitSliceBest')||0}catch(e){}
$('best').textContent='Best '+best;

// leaderboard (shared across players via the page's db capability)
let DB=null,USER=null,ME=null;
function lbNote(t){$('lbn').textContent=t}
async function renderLB(snap){
 const rows=snap.docs.map(d=>({id:d.id,best:+d.data().best||0}));
 const ol=$('lb');ol.textContent='';
 if(!rows.length){lbNote('No scores yet. Be the first on the board!');return}
 lbNote('');
 let pr={};try{pr=await USER.profiles(rows.map(r=>r.id))}catch(e){}
 ol.textContent='';
 rows.forEach((r,i)=>{
  const li=document.createElement('li'),p=pr[r.id]||{};
  if(r.id===ME||p.isMe)li.className='me';
  const a=document.createElement('span'),b=document.createElement('span'),c=document.createElement('span');
  a.className='rk';a.textContent=i+1;b.className='nm';b.textContent=(p.name||'Player')+(li.className?' (you)':'');c.className='sc';c.textContent=r.best;
  li.append(a,b,c);ol.appendChild(li);
 });
}
(async()=>{try{
 if(!window.claude){$('lbw').style.display='none';return}
 USER=await claude.use('user');DB=await claude.use('db');
 if(!USER||!DB){lbNote('Sign in to claude.ai to join the leaderboard.');return}
 ME=await USER.id();
 DB.collection('scores').orderBy('best','desc').limit(10).onSnapshot(renderLB,()=>lbNote('Leaderboard unavailable right now.'));
}catch(e){lbNote('Leaderboard unavailable right now.')}})();
async function saveScore(v){
 if(!DB||!ME||v<=0)return;
 try{const ref=DB.doc('scores/'+ME),sn=await ref.get();
  if(!sn.exists||(+sn.data().best||0)<v)await ref.set({best:v,ts:Date.now()});
 }catch(e){lbNote('Could not save your score to the leaderboard.')}
}

let objs=[],halves=[],parts=[],pops=[],trail=[],splats=[],cuts=[];
let state='menu',score=0,lives=3,spawnT=0,time=0,flash=0,shake=0;
let combo=0,lastSlice=0;

// audio
let AC=null,muted=false;
function tone(f1,f2,d,type,vol){
 if(muted)return;try{
 if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
 if(AC.state==='suspended')AC.resume();
 const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
 o.type=type||'triangle';o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);
 g.gain.setValueAtTime(vol||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
 o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}
}
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'Sound off':'Sound on';$('mute').setAttribute('aria-pressed',muted)};

function drawLives(){let s='';for(let i=0;i<3;i++)s+=i<lives?'❤️':'🖤';$('lives').textContent=s}

function rnd(a,b){return a+Math.random()*(b-a)}

function spawn(bomb){
 const g=H*1.5,r=(Math.min(W,H)*0.075+14)*(bomb?.9:TYPES[0].k*0+1);
 const t=bomb?null:TYPES[Math.floor(Math.random()*TYPES.length)];
 const rad=bomb?r*.95:r*t.k;
 const x=rnd(W*.15,W*.85),h=rnd(.55,.82)*H,vy=-Math.sqrt(2*g*h),T=2*-vy/g;
 const vx=(W/2-x)/T*rnd(.2,1.1)+rnd(-40,40);
 objs.push({x,y:H+rad,vx,vy,r:rad,rot:rnd(0,6),vr:rnd(-3,3),t,bomb:!!bomb,g});
}
function wave(){
 const lvl=Math.min(time/20,5);
 const n=1+Math.floor(Math.random()*(2+lvl*.6));
 const bombP=Math.min(.12+lvl*.04,.3);
 let bombs=0;
 for(let i=0;i<n;i++){const b=Math.random()<bombP&&bombs<2&&time>6;if(b)bombs++;setTimeout(()=>{if(state==='play')spawn(b)},i*130)}
}

function drawEmoji(t,r){ctx.font=(r*1.75)+'px '+EMOJI;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t.e,0,r*.06)}
function drawFruit(o){
 ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.rot);
 const r=o.r;
 if(o.bomb){
  const g=ctx.createRadialGradient(-r*.3,-r*.35,r*.1,0,0,r);g.addColorStop(0,'#555a6b');g.addColorStop(1,'#14141c');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();
  ctx.strokeStyle='#caa46a';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,-r);ctx.quadraticCurveTo(r*.3,-r*1.3,r*.55,-r*1.25);ctx.stroke();
  ctx.fillStyle=Math.sin(time*30)>0?'#ffd23f':'#ff5d3a';ctx.beginPath();ctx.arc(r*.55,-r*1.25,6,0,7);ctx.fill();
  ctx.strokeStyle='#ff5d8f';ctx.lineWidth=5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-r*.3,-r*.2);ctx.lineTo(r*.3,r*.4);ctx.moveTo(r*.3,-r*.2);ctx.lineTo(-r*.3,r*.4);ctx.stroke();
 }else drawEmoji(o.t,r);
 ctx.restore();
}
function drawHalf(h){
 const r=h.r,B=r*4;
 ctx.save();ctx.translate(h.x,h.y);ctx.rotate(h.rot0+h.rot);
 ctx.rotate(h.cut);ctx.beginPath();
 if(h.side)ctx.rect(-B,h.c,2*B,B);else ctx.rect(-B,-B,2*B,B+h.c);
 ctx.clip();
 ctx.rotate(-h.cut);drawEmoji(h.t,r);ctx.rotate(h.cut);
 const w=Math.sqrt(Math.max(0,r*r*.88-h.c*h.c)),sg=h.side?1:-1;
 ctx.lineCap='round';
 ctx.strokeStyle=h.t.flesh;ctx.lineWidth=r*.26;ctx.beginPath();ctx.moveTo(-w,h.c);ctx.lineTo(w,h.c);ctx.stroke();
 ctx.strokeStyle='#ffffff80';ctx.lineWidth=r*.05;ctx.beginPath();ctx.moveTo(-w*.8,h.c+sg*r*.07);ctx.lineTo(w*.8,h.c+sg*r*.07);ctx.stroke();
 ctx.restore();
}

function slice(o,ang,a){
 o.dead=true;
 const now=performance.now();
 if(o.bomb){boom(o);return}
 combo=now-lastSlice<350?combo+1:1;lastSlice=now;
 let pts=1;
 if(combo>=3){pts+=combo;pops.push({x:o.x,y:o.y-o.r-10,txt:'Combo x'+combo+'  +'+pts,life:1,c:'#ffd23f'})}
 else pops.push({x:o.x,y:o.y-o.r,txt:'+1',life:.7,c:'#fff7e6'});
 score+=pts;$('score').textContent=score;
 tone(700+combo*80,220,.14,'triangle',.18);
 let c=(o.x-a.x)*Math.sin(ang)-(o.y-a.y)*Math.cos(ang);c=Math.max(-o.r*.6,Math.min(o.r*.6,c));
 const na=ang+Math.PI/2;
 for(let s=0;s<2;s++){
  const dir=s?1:-1;
  halves.push({x:o.x,y:o.y,r:o.r,t:o.t,rot0:o.rot,rot:0,cut:ang-o.rot,c:c,side:s,
   vx:o.vx+Math.cos(na)*dir*150,vy:o.vy*.4+Math.sin(na)*dir*150-60,vr:dir*rnd(.5,2.5),g:o.g});
 }
 cuts.push({x:o.x,y:o.y,ang:ang,l:o.r*1.9,life:.18});
 const dots=[];for(let i=0;i<7;i++){const q=rnd(0,6.3),d=rnd(.8,2);dots.push({dx:Math.cos(q)*o.r*d,dy:Math.sin(q)*o.r*d,r:rnd(3,o.r*.28)})}
 splats.push({x:o.x,y:o.y,r:o.r*.9,c:o.t.juice,life:2.5,dots:dots});
 for(let i=0;i<26;i++){const q=ang+rnd(-.35,.35)+(Math.random()<.5?Math.PI/2:-Math.PI/2),sp=rnd(120,520);parts.push({x:o.x,y:o.y,vx:Math.cos(q)*sp,vy:Math.sin(q)*sp-100,life:rnd(.4,.9),c:o.t.juice,r:rnd(2,6)})}
}
function boom(o){
 state='over';flash=1;shake=1;tone(160,30,.7,'sawtooth',.3);
 for(let i=0;i<50;i++){const a=rnd(0,6.3),s=rnd(100,700);parts.push({x:o.x,y:o.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(.5,1),c:Math.random()<.5?'#ffd23f':'#ff5d3a',r:rnd(3,8)})}
 setTimeout(endGame,900);
}
function endGame(){
 state='over';
 if(score>best){best=score;try{localStorage.setItem('fruitSliceBest',best)}catch(e){}}
 $('best').textContent='Best '+best;
 saveScore(score);
 $('title').textContent='Game over';
 $('msg').textContent='You sliced '+score+(score===1?' fruit':' fruits')+(score>0&&score>=best?' — a new best!':'. Best is '+best+'.');
 $('play').textContent='Play again';$('ov').classList.remove('hide');
}
function start(){
 objs=[];halves=[];parts=[];splats=[];cuts=[];pops=[];trail=[];score=0;lives=3;time=0;spawnT=.4;flash=0;combo=0;
 $('score').textContent='0';drawLives();state='play';$('ov').classList.add('hide');
 tone(300,600,.2,'sine',.12);
}
$('play').onclick=start;

// input: touch/pen slice while pressed; mouse & trackpad slice on plain movement (or click-drag)
let down=false,last=null;
function pt(e){return{x:e.clientX,y:e.clientY,t:performance.now()}}
cv.addEventListener('pointerdown',e=>{down=true;last=pt(e);trail=[last];try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',e=>{
 if(e.pointerType!=='mouse'&&!down)return;
 const p=pt(e);
 if(state==='play'&&last){
  const dx=p.x-last.x,dy=p.y-last.y,len=Math.hypot(dx,dy);
  if(len>2){
   trail.push(p);
   if(len>6){const ang=Math.atan2(dy,dx);
    for(const o of objs){if(o.dead)continue;if(segHit(last,p,o)){slice(o,ang,last)}}}
  }
 }else if(last){trail.push(p)}
 last=p;
});
function up(){down=false;if(last&&state!=='play')trail=[];}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')last=null});
function segHit(a,b,o){
 const dx=b.x-a.x,dy=b.y-a.y,l2=dx*dx+dy*dy;
 let t=l2?((o.x-a.x)*dx+(o.y-a.y)*dy)/l2:0;t=Math.max(0,Math.min(1,t));
 return Math.hypot(a.x+dx*t-o.x,a.y+dy*t-o.y)<o.r;
}

let prev=performance.now();
function frame(now){
 const dt=Math.min((now-prev)/1000,.033);prev=now;
 if(state==='play'){time+=dt;spawnT-=dt;
  if(spawnT<=0){wave();spawnT=Math.max(.7,1.7-time*.015)+rnd(0,.5)}}
 if(state==='play'||state==='over'){
  for(const o of objs){o.vy+=o.g*dt;o.x+=o.vx*dt;o.y+=o.vy*dt;o.rot+=o.vr*dt;
   if(o.y-o.r>H&&o.vy>0){o.dead=true;
    if(!o.bomb&&state==='play'){lives--;drawLives();tone(200,90,.3,'sine',.2);shake=.4;
     pops.push({x:Math.max(40,Math.min(W-40,o.x)),y:H-60,txt:'Missed',life:.9,c:'#ff5d8f'});
     if(lives<=0){state='over';setTimeout(endGame,500)}}}}
  objs=objs.filter(o=>!o.dead);
  for(const h of halves){h.vy+=h.g*dt;h.x+=h.vx*dt;h.y+=h.vy*dt;h.rot+=h.vr*dt}
  halves=halves.filter(h=>h.y-h.r<H+50);
  for(const p of parts){p.vy+=900*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=40*dt;p.life-=dt}
  pops=pops.filter(p=>p.life>0);
  for(const q of cuts)q.life-=dt;cuts=cuts.filter(q=>q.life>0);
  for(const q of splats)q.life-=dt;splats=splats.filter(q=>q.life>0);
 }
 const nt=performance.now();
 trail=trail.filter(p=>nt-p.t<160);
 shake=Math.max(0,shake-dt*2);flash=Math.max(0,flash-dt*1.5);

 ctx.save();ctx.clearRect(0,0,W,H);
 if(shake>0)ctx.translate(rnd(-1,1)*shake*12,rnd(-1,1)*shake*12);
 for(const q of splats){ctx.globalAlpha=Math.min(.4,q.life*.25);ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,7);ctx.fill();for(const d of q.dots){ctx.beginPath();ctx.arc(q.x+d.dx,q.y+d.dy,d.r,0,7);ctx.fill()}}
 ctx.globalAlpha=1;
 for(const o of objs)drawFruit(o);
 for(const h of halves)drawHalf(h);
 for(const q of cuts){ctx.globalAlpha=q.life/.18;ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(q.x-Math.cos(q.ang)*q.l,q.y-Math.sin(q.ang)*q.l);ctx.lineTo(q.x+Math.cos(q.ang)*q.l,q.y+Math.sin(q.ang)*q.l);ctx.stroke()}
 ctx.globalAlpha=1;
 for(const p of parts){ctx.globalAlpha=Math.max(0,Math.min(1,p.life*1.5));ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}
 ctx.globalAlpha=1;
 ctx.textAlign='center';ctx.font='28px "Lilita One","Trebuchet MS",sans-serif';
 for(const p of pops){ctx.globalAlpha=Math.min(1,p.life*2);ctx.fillStyle=p.c;ctx.fillText(p.txt,p.x,p.y)}
 ctx.globalAlpha=1;
 // blade trail
 if(trail.length>1){
  ctx.lineCap='round';ctx.lineJoin='round';
  for(let i=1;i<trail.length;i++){
   const a=trail[i-1],b=trail[i],f=1-(nt-b.t)/160;
   ctx.strokeStyle='rgba(120,230,255,'+(.35*f)+')';ctx.lineWidth=16*f;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
   ctx.strokeStyle='rgba(255,255,255,'+f+')';ctx.lineWidth=5*f;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
  }
 }
 ctx.restore();
 if(flash>0){ctx.fillStyle='rgba(255,255,255,'+flash*.85+')';ctx.fillRect(0,0,W,H)}
 requestAnimationFrame(frame);
}
drawLives();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
